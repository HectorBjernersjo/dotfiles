# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
source-file $HOME/.config/tmux/theme.conf
# set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB:sync"

# Let kitty graphics protocol escape sequences pass through tmux (needed for snacks image)
set -g allow-passthrough on
set -g visual-activity off

set-option -g default-shell /usr/bin/zsh
# set-option -g default-shell /bin/bash

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on
set -s escape-time 0

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
# bind-key -n C-w send-keys F13

# bind v split-window -v \; select-layout even-vertical
# bind h split-window -h \; select-layout even-horizontal
bind v split-window -v \; select-layout -E
bind m split-window -h \; select-layout -E
set-hook -g pane-exited 'run-shell "tmux select-layout -E"'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h resize-pane -L 10
bind -n M-j resize-pane -D 10
bind -n M-k resize-pane -U 10
bind -n M-l resize-pane -R 10

# Enable switching windows with Alt+1, Alt+2, etc.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
# # bind -n M-Left select-window -t -1
# bind -n M-Right select-window -t +1
# bind -n M-S-Left swap-window -t -1 \; select-window -t -1
# bind -n M-S-Right swap-window -t +1 \; select-window -t +1
# bind -n M-0 select-window -t 0

# bind s run-shell /home/hector/.config/tmux/scripts/session.sh
# bind -n C-f run-shell /home/hector/.config/tmux/scripts/projectfzf.sh
bind -n C-q run-shell "/home/hector/.cargo/bin/corc open"
bind -n C-f display-popup -E -B -w 50% -h 40% "/home/hector/.cargo/bin/corc projects"

# bind -n C-w run-shell /home/hector/.config/tmux/scripts/worktrees.sh
# bind -n C-e run-shell /home/hector/.config/tmux/scripts/agent-panes-all.sh
# bind e run-shell /home/hector/.config/tmux/scripts/agent-panes.sh

# Save tmux environment variables
set -g @resurrect-capture-pane-contents 'on'
set status-bg default

# Set vi as the key binding mode
set-window-option -g mode-keys vi

# Copy the entire line with 'yy' and don't exit copy mode
# bind-key -T copy-mode-vi y send-keys -X select-line \; send-keys -X copy-pipe 'xclip -in -selection clipboard'


bind-key -T copy-mode-vi i send -X cancel
#
# Start selection with 'v'
bind-key -T copy-mode-vi v send -X begin-selection

# Select the entire line with 'V'
bind-key -T copy-mode-vi V send -X select-line
# bind-key -T copy-mode-vi y send -X copy-pipe 'xclip -in -selection clipboard'

set-option -g history-limit 100000
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
# Let apps request modified keys as CSI-u (corc uses Ctrl+1..4). Ghostty and
# kitty send these natively via the kitty keyboard protocol; alacritty lacks it
# and needs explicit keyboard bindings in alacritty.toml.
set -s extended-keys on

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Override vim-tmux-navigator so it doesn't wrap around at the edge panes.
# When in vim/fzf, forward the key; otherwise only switch pane if one exists
# in that direction (do nothing at the edge).
bind-key -n C-h if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys C-h" 'if-shell -F "#{pane_at_left}" "" "select-pane -L"'
bind-key -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys C-j" 'if-shell -F "#{pane_at_bottom}" "" "select-pane -D"'
bind-key -n C-k if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys C-k" 'if-shell -F "#{pane_at_top}" "" "select-pane -U"'
bind-key -n C-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys C-l" 'if-shell -F "#{pane_at_right}" "" "select-pane -R"'
