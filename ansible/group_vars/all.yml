---
# Absolute path to the dotfiles repo root (this playbook lives in <repo>/ansible).
dotfiles_repo: "{{ playbook_dir | dirname }}"

# Pinned versions for toolchain installers (bump when you want a new major).
dotnet_channel: "8.0"

# Optional config overlay: every directory/file in overlays/<name>/.config/
# is linked into ~/.config/ INSTEAD of the same-named entry from .config/.
# Lets a machine run divergent configs (e.g. Omarchy) without touching the
# defaults. Empty string = no overlay.
overlay: ""

# ---------------------------------------------------------------------------
# Symlink map. `src` is relative to the repo root, `dest` is an absolute path.
# Directory-level links for dirs the repo fully owns; file-level links where
# the target directory is shared with machine state (e.g. ~/.ssh).
# ---------------------------------------------------------------------------
dotfile_links:
  # file-level
  - { src: ".zshrc", dest: "{{ ansible_facts.env.HOME }}/.zshrc" }
  - { src: ".gitconfig", dest: "{{ ansible_facts.env.HOME }}/.gitconfig" }
  - { src: ".ssh/config", dest: "{{ ansible_facts.env.HOME }}/.ssh/config" }
  - { src: ".config/starship.toml", dest: "{{ ansible_facts.env.HOME }}/.config/starship.toml" }
  # file-level: ~/.config/jj also holds machine-local state (repos/)
  - { src: ".config/jj/config.toml", dest: "{{ ansible_facts.env.HOME }}/.config/jj/config.toml" }
  # global AGENTS.md, one source of truth linked into every AI tool's location
  - { src: ".agents/AGENTS.md", dest: "{{ ansible_facts.env.HOME }}/.claude/CLAUDE.md" }
  - { src: ".agents/AGENTS.md", dest: "{{ ansible_facts.env.HOME }}/.codex/AGENTS.md" }
  - { src: ".agents/AGENTS.md", dest: "{{ ansible_facts.env.HOME }}/.config/opencode/AGENTS.md" }
  - { src: ".agents/AGENTS.md", dest: "{{ ansible_facts.env.HOME }}/.cursor/rules/agents.mdc" }
  # directory-level (CLI/dev, all profiles)
  - { src: ".config/nvim", dest: "{{ ansible_facts.env.HOME }}/.config/nvim" }
  - { src: ".config/tmux", dest: "{{ ansible_facts.env.HOME }}/.config/tmux" }
  - { src: ".config/fish", dest: "{{ ansible_facts.env.HOME }}/.config/fish" }
  - { src: ".config/starship", dest: "{{ ansible_facts.env.HOME }}/.config/starship" }
  - { src: ".config/systemd", dest: "{{ ansible_facts.env.HOME }}/.config/systemd" }
  # config.local.json is machine-local, ignored via .config/jjsync/.gitignore
  - { src: ".config/jjsync", dest: "{{ ansible_facts.env.HOME }}/.config/jjsync" }
  # corc's shared project list; its machine-local state lives in ~/.local/state
  - { src: ".config/corc", dest: "{{ ansible_facts.env.HOME }}/.config/corc" }
  - { src: ".agents", dest: "{{ ansible_facts.env.HOME }}/.agents" }

# Desktop-only links (only applied when install_gui is true).
gui_dotfile_links:
  - { src: ".config/hypr", dest: "{{ ansible_facts.env.HOME }}/.config/hypr" }
  - { src: ".config/waybar", dest: "{{ ansible_facts.env.HOME }}/.config/waybar" }
  - { src: ".config/wofi", dest: "{{ ansible_facts.env.HOME }}/.config/wofi" }
  - { src: ".config/sway", dest: "{{ ansible_facts.env.HOME }}/.config/sway" }
  - { src: ".config/ghostty", dest: "{{ ansible_facts.env.HOME }}/.config/ghostty" }
  - { src: ".config/kitty", dest: "{{ ansible_facts.env.HOME }}/.config/kitty" }
  # Picks the default terminal for xdg-terminal-exec (Ghostty; kitty stays installed).
  - { src: ".config/xdg-terminals.list", dest: "{{ ansible_facts.env.HOME }}/.config/xdg-terminals.list" }
  - { src: ".config/gtk-3.0", dest: "{{ ansible_facts.env.HOME }}/.config/gtk-3.0" }
  - { src: ".config/gtk-4.0", dest: "{{ ansible_facts.env.HOME }}/.config/gtk-4.0" }
  - { src: ".config/kanata", dest: "{{ ansible_facts.env.HOME }}/.config/kanata" }
  - { src: ".config/xremap", dest: "{{ ansible_facts.env.HOME }}/.config/xremap" }

# ---------------------------------------------------------------------------
# Personal projects, cloned as colocated jj repos (HTTPS; gh credential
# helper handles private ones).
# ORDER MATTERS: a parent repo must come before repos nested inside it, or the
# nested clone leaves the parent's directory non-empty and its clone fails.
# ---------------------------------------------------------------------------
projects:
  # Config repos that live INSIDE the dotfiles repo (listed in its .gitignore,
  # ex-submodules). Cloned unpinned: whatever their default branch is at.
  - repo: "https://github.com/HectorBjernersjo/neovim-config.git"
    dest: "{{ dotfiles_repo }}/.config/nvim"
  - repo: "https://github.com/HectorBjernersjo/.agents.git"
    dest: "{{ dotfiles_repo }}/.agents"
  # The gbandit monorepo: platform, cli and game-template in one private repo.
  # `main` is its default jj workspace; feature workspaces become siblings of it
  # (scripts/feature-start.sh), and dev-instances.txt lives in the parent.
  - repo: "https://github.com/gbandit/gbandit.git"
    dest: "{{ ansible_facts.env.HOME }}/projects/gbandit/main"
  # Rust tools — cloned and `cargo install`ed into ~/.cargo/bin.
  - repo: "https://github.com/HectorBjernersjo/du-tree.git"
    dest: "{{ ansible_facts.env.HOME }}/projects/du-tree"
    cargo_install: true
  - repo: "https://github.com/HectorBjernersjo/quim.git"
    dest: "{{ ansible_facts.env.HOME }}/projects/quim"
    cargo_install: true
  - repo: "https://github.com/HectorBjernersjo/corc.git"
    dest: "{{ ansible_facts.env.HOME }}/projects/corc"
    cargo_install: true

# NOTE: bin/, theme/ and wallpapers/ are intentionally NOT linked —
# .zshrc and the desktop configs reference them in-place via $DOTFILES_PATH ($HOME/dotfiles).
# .zshrc.local is gitignored (machine-local secrets); a stub is created by the
# dotfiles role so `source ~/.zshrc.local` never fails.
