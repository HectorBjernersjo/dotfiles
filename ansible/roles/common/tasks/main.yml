---
# Base directories and repo prerequisites needed by every later role.
- name: Ensure base directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ansible_facts.env.HOME }}/.config", mode: "0755" }
    - { path: "{{ ansible_facts.env.HOME }}/.local/bin", mode: "0755" }
    - { path: "{{ ansible_facts.env.HOME }}/.cache", mode: "0755" }
    - { path: "{{ ansible_facts.env.HOME }}/.ssh", mode: "0700" }
